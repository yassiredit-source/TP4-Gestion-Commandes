<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP4 - Application JavaScript</title>
    <link rel="stylesheet" href="css/style.css" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        

        <div id="error-zone" class="alert alert-danger d-none"></div>


        <h1>Gestion des Commandes</h1>
        <hr>


        <div id="indicators-zone" class="mb-4">
            <h4>Indicateurs :</h4>
            <ul>
                <li>Total Clients : <span id="count-customers">0</span></li>
                <li>Total Produits : <span id="count-products">0</span></li>
                <li>Total Commandes : <span id="count-orders">0</span></li>
                <li>Montant Cumulé : <span id="sum-orders">0</span> MAD</li>
            </ul>
        </div>


        <div class="mb-4">
            <h4>Filtres :</h4>
            <div class="row">
                <div class="col-md-4 mb-2">
                    <input type="text" id="searchInput" class="form-control" placeholder="Rechercher un client...">
                </div>
                <div class="col-md-4 mb-2">
                    <select id="statusFilter" class="form-select">
                        <option value="">Tous les statuts</option>
                        <option value="Livree">Livrée</option>
                        <option value="En attente">En attente</option>
                        <option value="Annulee">Annulée</option>
                    </select>
                </div>
                <div class="col-md-4 mb-2">
                    <select id="categoryFilter" class="form-select">
                        <option value="">Toutes les catégories</option>
                    </select>
                </div>
            </div>
        </div>


        <div>
            <h4>Liste des Commandes :</h4>
            <div id="orders-zone">

            </div>
        </div>

    </div>


    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Détail de la commande</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modal-content">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
